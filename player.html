<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>THE MITRO — players</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--void:#05060a;--panel:#0b0d14;--panel2:#0f1219;--silver:#e9ebef;--dim:#8a909c;--faint:#5a606c;
    --gold:#fffc52;--hair:rgba(233,235,239,.08);--hair2:rgba(233,235,239,.14);}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--void);color:var(--silver);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:44px 20px;
    background:radial-gradient(1200px 600px at 70% -10%,rgba(255,252,82,.05),transparent 60%),
      radial-gradient(900px 500px at 0% 110%,rgba(120,140,180,.06),transparent 55%),var(--void);}
  .wrap{width:100%;max-width:880px}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:0 0 18px;padding:0 4px}
  .eyebrow{font-size:11px;letter-spacing:.5em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;font-weight:500}
  .title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,7vw,74px);line-height:.86;letter-spacing:.02em}
  .title .a{background:linear-gradient(100deg,#6f7682,#fff 28%,#aeb4bf 52%,#fff 74%,#727885);
    background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite}
  .title .b{color:var(--gold)}
  @keyframes shimmer{to{background-position:-220% 0}}
  .tag{font-size:11px;letter-spacing:.34em;color:var(--faint);text-transform:uppercase;text-align:right;white-space:nowrap}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:0 4px}
  .tab{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.08em;color:var(--dim);background:none;
    border:1px solid var(--hair2);border-radius:999px;padding:7px 15px;cursor:pointer;transition:.18s}
  .tab:hover{color:#fff}
  .tab.active{color:var(--gold);border-color:rgba(255,252,82,.45);background:rgba(255,252,82,.06)}
  .player{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--hair);
    border-radius:18px;overflow:hidden;display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto auto;
    box-shadow:0 40px 120px -40px rgba(0,0,0,.9)}
  .left{grid-row:1;grid-column:1;border-right:1px solid var(--hair);padding:22px;display:flex;flex-direction:column;
    gap:18px;align-items:center;justify-content:flex-start;background:radial-gradient(120% 90% at 50% 18%,#13171f,#0a0c12 70%)}
  .art-wrap{width:100%;aspect-ratio:1/1;position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--hair2);background:#0a0c12}
  .mono{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48%;z-index:1;opacity:.9}
  .art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;display:block;background:#0a0c12}
  .listen{display:flex;gap:26px;align-items:center;justify-content:center;width:100%}
  .lk{display:inline-flex;padding:6px;cursor:pointer;line-height:0}
  .ico{display:block;width:30px;height:30px;background-color:var(--silver);
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
    -webkit-mask-size:contain;mask-size:contain;-webkit-mask-mode:alpha;mask-mode:alpha;
    transition:background-color .2s ease, transform .2s ease}
  .lk:hover .ico{transform:scale(1.1)}
  .lk.sp:hover .ico{background-color:#1DB954}
  .lk.am:hover .ico{background-color:#FA2D48}

  .panel-r{grid-row:1;grid-column:2;display:flex;flex-direction:column;min-width:0}
  .phead{padding:24px 26px 12px}
  .phead h2{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.03em;line-height:1;color:#fff}
  .phead .sub{font-size:11px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase;margin-top:8px;font-weight:500}
  .tracks{list-style:none;overflow-y:auto;max-height:340px;padding:0 14px 14px}
  .tracks::-webkit-scrollbar{width:8px}.tracks::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
  .trk{display:block;padding:11px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s}
  .trk:hover{background:rgba(255,255,255,.035)}
  .trk.active{background:rgba(255,252,82,.05);border-color:rgba(255,252,82,.32)}
  .trkrow{display:flex;align-items:center;gap:12px}
  .trk .no{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--faint);width:22px;flex:0 0 22px}
  .trk.active .no{color:var(--gold)}
  .trk .nm{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.05em;color:#d3d8e1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trk.active .nm{color:#fff}
  .trk .dur{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .dl{display:none;align-items:center;justify-content:center;color:var(--dim);padding:3px;border-radius:7px;flex:0 0 auto;transition:.15s}
  .dl svg{width:18px;height:18px;fill:currentColor;display:block}
  .dl:hover{color:var(--gold);background:rgba(255,252,82,.08)}
  .trk.active .dl{display:inline-flex}
  .trkwave{display:none;height:0;overflow:hidden;opacity:0;transition:height .3s ease,opacity .25s ease}
  .trk.active .trkwave{height:64px;opacity:1}
  .trkwinner{display:flex;align-items:center;gap:13px;margin-top:8px}
  .rowplay{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);
    background:none;color:#fff;display:grid;place-items:center;cursor:pointer;transition:.2s}
  .rowplay.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 16px -2px rgba(255,252,82,.5)}
  .rowplay svg{width:18px;height:18px;fill:currentColor;display:block}
  .rww{flex:1;height:46px;display:block;cursor:pointer;touch-action:none;min-width:0}
  .transport{grid-row:2;grid-column:1/-1;border-top:1px solid var(--hair);display:flex;align-items:center;gap:16px;padding:16px 26px;background:rgba(0,0,0,.25)}
  .ctrls{display:flex;align-items:center;gap:14px;flex:0 0 auto}
  .ic{background:none;border:none;color:var(--silver);cursor:pointer;display:grid;place-items:center;padding:6px;border-radius:50%;transition:.15s}
  .ic:hover{color:#fff}.ic svg{width:20px;height:20px;fill:currentColor;display:block}
  .play{width:50px;height:50px;border:1.5px solid rgba(255,255,255,.5);border-radius:50%;color:#fff;transition:.2s}
  .play.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 22px -2px rgba(255,252,82,.5)}
  .play svg{width:22px;height:22px}
  .time{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;width:38px;text-align:center;flex:0 0 auto}
  .waveform{flex:1;height:48px;min-width:0;display:block;cursor:pointer}
  .vol{display:flex;align-items:center;gap:8px;flex:0 0 auto}.vol svg{width:18px;height:18px;fill:var(--faint)}
  .vol input{width:84px;accent-color:var(--gold);cursor:pointer}
  .note{text-align:center;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:16px;line-height:1.8}
  @media(max-width:660px){
    .player{display:flex;flex-direction:column}
    .left{border-right:none;border-bottom:1px solid var(--hair);padding-bottom:20px}
    .art-wrap{max-width:330px;margin:0 auto}
    .tracks{max-height:none}
    .trkwave{display:block}
    .transport{display:none}
    .head{flex-direction:column;align-items:flex-start;gap:6px}.tag{text-align:left}
    .title{font-size:clamp(38px,12vw,60px)}
  }
  @media(prefers-reduced-motion:reduce){.title .a{animation:none}.trkwave{transition:none}}
  /* embed mode (inside the main site, one release per iframe) */
  body.embed{min-height:0;padding:0;display:block;background:transparent}
  .embed .wrap{max-width:100%}
  .embed .head,.embed .tabs,.embed .note{display:none}
  .embed .tracks{max-height:none}
  .embed .player{box-shadow:none;border-color:rgba(233,235,239,.10)}
</style>

    cv.addEventListener('mousedown',e=>{e.stopPropagation();scrubbing=true;scrubCv=cv;seekAt(cv,e.clientX);});
    cv.addEventListener('touchstart',e=>{e.stopPropagation();seekAt(cv,e.touches[0].clientX);},{passive:true});
    cv.addEventListener('touchmove',e=>{e.stopPropagation();seekAt(cv,e.touches[0].clientX);},{passive:true});
    inner.appendChild(rp);inner.appendChild(cv);wrap.appendChild(inner);
    li.appendChild(row);li.appendChild(wrap);list.appendChild(li);
  });
  selectTrack(0,false);
}
function selectTrack(i,autoplay){idx=i;highlight();
  audio.src=curTrack().path;audio.load();
  if(autoplay)play();else{setPlayUI(false);$('cur').textContent='0:00';}
}
function highlight(){document.querySelectorAll('.trk').forEach((el,i)=>el.classList.toggle('active',i===idx));
  $('tot').textContent=fmt(curTrack().dur);}
function setPlayUI(on){$('play').classList.toggle('on',on);
  $('playicon').innerHTML=on?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $('play').setAttribute('aria-label',on?'Pause':'Play');
  const rp=document.querySelector('.trk.active .rowplay');
  if(rp){rp.innerHTML=on?PAUSE_SVG:PLAY_SVG;rp.classList.toggle('on',on);}}
function play(){audio.play().then(()=>setPlayUI(true)).catch(()=>setPlayUI(false));}
function pause(){audio.pause();setPlayUI(false);}
function toggle(){audio.paused?play():pause();}
$('play').addEventListener('click',toggle);
$('next').addEventListener('click',()=>selectTrack((idx+1)%RELEASES[rel].tracks.length,true));
$('prev').addEventListener('click',()=>selectTrack((idx-1+RELEASES[rel].tracks.length)%RELEASES[rel].tracks.length,true));
$('vol').addEventListener('input',e=>{audio.volume=e.target.value/100;});
audio.addEventListener('ended',()=>selectTrack((idx+1)%RELEASES[rel].tracks.length,true));
audio.addEventListener('loadedmetadata',()=>{if(isFinite(audio.duration)&&audio.duration>0){curTrack().dur=audio.duration;$('tot').textContent=fmt(audio.duration);}});
audio.addEventListener('play',()=>setPlayUI(true));
audio.addEventListener('pause',()=>{if(!audio.ended)setPlayUI(false);});
const wv=$('wave');
wv.addEventListener('mousedown',e=>{scrubbing=true;scrubCv=wv;seekAt(wv,e.clientX);});
wv.addEventListener('touchstart',e=>{seekAt(wv,e.touches[0].clientX);},{passive:true});
wv.addEventListener('touchmove',e=>{seekAt(wv,e.touches[0].clientX);},{passive:true});
window.addEventListener('mousemove',e=>{if(scrubbing&&scrubCv)seekAt(scrubCv,e.clientX);});
window.addEventListener('mouseup',()=>{scrubbing=false;});
function drawInto(c){if(!c)return;
  const dpr=window.devicePixelRatio||1,cw=c.clientWidth,ch=c.clientHeight||48;if(cw<2)return;
  if(c._w!==cw||c._h!==ch){c.width=cw*dpr;c.height=ch*dpr;c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);c._w=cw;c._h=ch;}
  const g=c.getContext('2d'),W=cw,H=ch;g.clearRect(0,0,W,H);
  const pk=curTrack().wave,n=pk.length,bw=W/n,mid=H/2,played=Math.min((audio.currentTime||0)/dur(),1);
  for(let i=0;i<n;i++){let v=pk[i]/100;v=Math.pow(v,1.18);
    const h=Math.max(1.4,v*H*0.86),x=i*bw,fr=(i+0.5)/n;
    g.fillStyle=fr<=played?'#cfd5e0':'#39414f';g.fillRect(x,mid-h/2,Math.max(0.8,bw-0.5),h);}
  g.fillStyle='#fffc52';g.fillRect(played*W-1,0,2,H);}
function loop(){requestAnimationFrame(loop);if(!audio.paused)$('cur').textContent=fmt(audio.currentTime);drawInto(waveCanvas());}
let _start=0;if(_relParam){const k=RELEASES.findIndex(r=>r.id===_relParam);if(k>=0)_start=k;}
loadRelease(_start);requestAnimationFrame(loop);
function postHeight(){if(window.parent===window)return;const el=document.querySelector('.wrap');if(!el)return;
  const h=Math.ceil(el.getBoundingClientRect().height)+10;parent.postMessage({mitroHeight:h,rel:_relParam||''},'*');}
if(EMBED){window.addEventListener('load',postHeight);window.addEventListener('resize',postHeight);
  if(window.ResizeObserver){try{new ResizeObserver(postHeight).observe(document.querySelector('.wrap'));}catch(e){}}
  setTimeout(postHeight,200);setTimeout(postHeight,800);setTimeout(postHeight,1600);}

function postMitro(o){if(window.parent!==window){o.rel=_relParam||'';try{parent.postMessage(o,'*');}catch(e){}}}
function postPlay(){if(typeof curTrack!=='function')return;var t=curTrack();postMitro({mitro:'play',title:t.nm,cat:RELEASES[rel].title,dur:t.dur,wave:t.wave,cover:RELEASES[rel].cover,time:audio.currentTime});}
if(EMBED){
  var _play=play,_pause=pause;
  play=function(){_play();postPlay();};
  pause=function(){_pause();postMitro({mitro:'pause'});};
  setInterval(function(){if(!audio.paused)postMitro({mitro:'time',time:audio.currentTime,dur:dur()});},120);
  window.addEventListener('message',function(e){var d=e.data;if(!d||!d.mitroCmd)return;var a=d.mitroCmd;
    if(a==='toggle')toggle();else if(a==='play')play();else if(a==='pause')pause();
    else if(a==='stop'){if(!audio.paused)pause();}
    else if(a==='next')selectTrack((idx+1)%RELEASES[rel].tracks.length,true);
    else if(a==='prev')selectTrack((idx-1+RELEASES[rel].tracks.length)%RELEASES[rel].tracks.length,true);
    else if(a==='seek'){var tt=(d.frac||0)*dur();try{audio.currentTime=tt;}catch(_){}}
    else if(a==='vol'){audio.volume=Math.min(1,Math.max(0,d.v));}
  });
}
</script>
</body>
