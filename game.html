<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>THE MITRO — HYPERSPACE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
    #scene { position: fixed; inset: 0; display: block; cursor: grab; touch-action: none; }
    #scene.grabbing { cursor: grabbing; }
    .game-btn { position: fixed; z-index: 30; cursor: pointer; background: rgba(0,0,0,0.35); color: #fff;
      border: 1px solid rgba(255,255,255,0.5); border-radius: 4px; font-family: 'Inter', sans-serif; font-weight: 500;
      letter-spacing: 0.18em; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      transition: color .2s, border-color .2s, background .2s; }
    .game-btn:hover { color: #FFFC52; border-color: rgba(255,252,82,0.8); }
    #exitBtn { top: 18px; right: 18px; padding: 9px 18px; font-size: 13px; }
    #muteBtn { top: 18px; left: 18px; width: 38px; height: 38px; font-size: 16px; padding: 0; line-height: 1; }
    #muteBtn.off { color: #888; }
    #hint { position: fixed; left: 0; right: 0; bottom: 26px; z-index: 20; text-align: center; font-size: 12px;
      letter-spacing: 0.18em; color: rgba(255,255,255,0.5); pointer-events: none; transition: opacity .6s ease; }
    #loading { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
      background: #000; color: #fff; font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.3em; font-size: 28px; }
    .credit { position: fixed; bottom: 8px; right: 12px; z-index: 20; font-size: 10px; letter-spacing: 0.06em; color: #fff; opacity: 0.35; font-family: 'Bebas Neue', sans-serif; }
  </style>
</head>
<body>
  <div id="loading">ENTERING HYPERSPACE&#8230;</div>
  <canvas id="scene"></canvas>
  <div id="hint">DRAG THE SHIP &#160;&#183;&#160; &#8592; SLOWER &#160;&#160;|&#160;&#160; FASTER &#8594;</div>
  <button id="exitBtn" class="game-btn" aria-label="Exit to site">EXIT</button>
  <button id="muteBtn" class="game-btn" aria-label="Toggle music">&#9834;</button>
  <div class="credit">THE MITRO</div>
  <audio id="bgm" src="game_track.mp3" loop preload="auto"></audio>

  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const isMobile = window.innerWidth < 760 || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

    const NOISE = `
      vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
      vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
      vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
      float snoise(vec3 v){
        const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
        vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
        vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
        vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy; i=mod289(i);
        vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
        float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
        vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
        vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
        vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
        vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
        vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
        vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
        vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
        p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
        vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
        return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
      }
      float fbm(vec3 p){ float f=0.0,a=0.5; for(int i=0;i<4;i++){ f+=a*snoise(p); p*=2.0; a*=0.5; } return f*0.5+0.5; }
    `;

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000005);
    scene.fog = new THREE.FogExp2(0x000008, 0.012);

    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 3000);
    camera.position.set(0, 1.0, 7.6); camera.lookAt(0, 0, 0);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.add(new THREE.HemisphereLight(0xaaccff, 0x101018, 1.1));
    const key = new THREE.DirectionalLight(0xffffff, 3.2); key.position.set(4, 6, 5); scene.add(key);
    const rim = new THREE.DirectionalLight(0x99ccff, 2.2); rim.position.set(-5, 1, -4); scene.add(rim);
    // strong camera-side fill so the ship is always lit by direct light (fixes black metal in Chrome)
    const fill = new THREE.PointLight(0xffffff, 80, 60, 2); fill.position.set(1, 2, 8); scene.add(fill);
    const engineLight = new THREE.PointLight(0xffd28a, 0, 16, 2); scene.add(engineLight);

    // ===================== SHIP =====================
    const ship = new THREE.Group(); ship.position.set(-2.4, 0, 0); scene.add(ship);
    let shipModel = null;
    let NOZZLE = -0.5;                 // computed precisely from model bounds on load
    let glowBase = 0.4;                // glow radius tied to ship height (set on load)
    new GLTFLoader().load('ship.glb', (gltf) => {
      const m = gltf.scene;
      const box = new THREE.Box3().setFromObject(m);
      const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
      m.position.sub(center);
      m.scale.setScalar(1.3 / (Math.max(size.x, size.y, size.z) || 1));
      m.rotation.y = Math.PI / 2;                 // nose -> +X (right)
      m.traverse((o) => { if (o.isMesh && o.material) { const mt = o.material;
        // keep the model's own metalness (do NOT force it high — that made it env-only -> black in Chrome)
        mt.envMapIntensity = 1.6;
        if (mt.roughness !== undefined) mt.roughness = Math.min(mt.roughness, 0.6);
        mt.needsUpdate = true; } });
      ship.add(m); shipModel = m;
      // precise nozzle = rear-most point of the model in ship-local space
      const b = new THREE.Box3().setFromObject(m);
      NOZZLE = (b.min.x - ship.position.x) + 0.06;
      // glow sized to the engine cross-section (model height), so it never exceeds the ship
      glowBase = Math.max(0.12, (b.max.y - b.min.y) * 0.5);
      glow.position.x = NOZZLE;
      document.getElementById('loading').style.display = 'none';
    }, undefined, () => { document.getElementById('loading').textContent = 'ship.glb not found'; });

    // ===================== STREAKS =====================
    const COUNT = isMobile ? 460 : 1200, RANGE = 150;
    const base = new THREE.PlaneGeometry(1, 1);
    const sGeo = new THREE.InstancedBufferGeometry();
    sGeo.index = base.index;
    sGeo.setAttribute('position', base.attributes.position);
    sGeo.setAttribute('uv', base.attributes.uv);
    const offs = new Float32Array(COUNT * 3), mets = new Float32Array(COUNT * 2), seeds = new Float32Array(COUNT);
    for (let i = 0; i < COUNT; i++) {
      offs[i*3] = (Math.random()*2-1)*RANGE*0.5;
      offs[i*3+1] = (Math.random()*2-1)*9.0;
      offs[i*3+2] = (Math.random()*2-1)*16.0;
      mets[i*2] = 1.6 + Math.random()*4.0;
      mets[i*2+1] = 0.015 + Math.random()*0.05;
      seeds[i] = Math.random();
    }
    sGeo.setAttribute('aOffset', new THREE.InstancedBufferAttribute(offs, 3));
    sGeo.setAttribute('aMetrics', new THREE.InstancedBufferAttribute(mets, 2));
    sGeo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 1));
    sGeo.instanceCount = COUNT;
    const streakMat = new THREE.ShaderMaterial({
      uniforms: { uDist: { value: 0 }, uSpeed: { value: 0.1 }, uRange: { value: RANGE }, uCore: { value: new THREE.Color(0xcfe6ff) } },
      vertexShader: `
        attribute vec3 aOffset; attribute vec2 aMetrics; attribute float aSeed;
        uniform float uDist, uSpeed, uRange;
        varying vec2 vUv; varying float vSeed; varying float vBright;
        void main(){
          vUv = uv; vSeed = aSeed;
          float len = aMetrics.x * (0.5 + uSpeed*3.2);
          vec3 p = position; p.x *= len; p.y *= aMetrics.y;
          float spd = uDist * (0.6 + aSeed*0.9);
          float x = mod(aOffset.x - spd + uRange*0.5, uRange) - uRange*0.5;
          p.x += x; p.y += aOffset.y; p.z += aOffset.z;
          vBright = clamp(0.3 + (aOffset.z + 16.0)/32.0 * 0.7, 0.1, 1.0);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }`,
      fragmentShader: `
        uniform vec3 uCore; varying vec2 vUv; varying float vSeed; varying float vBright;
        void main(){
          float ends = smoothstep(0.0,0.18,vUv.x)*smoothstep(1.0,0.82,vUv.x);
          float core = pow(smoothstep(0.5,0.0,abs(vUv.y-0.5)), 1.6);
          vec3 tint = mix(vec3(0.78,0.88,1.0), vec3(1.0,0.95,0.86), vSeed*vSeed);
          float a = ends*core*vBright;
          gl_FragColor = vec4(uCore*tint*a*1.4, a);
        }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false, side: THREE.DoubleSide, fog: false
    });
    const streaks = new THREE.Mesh(sGeo, streakMat); streaks.frustumCulled = false; scene.add(streaks);
    let streakDist = 0;

    // ===================== EXHAUST PLUME =====================
    const plumeMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uThrottle: { value: 0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: NOISE + `
        uniform float uTime, uThrottle; varying vec2 vUv;
        void main(){
          float along = 1.0 - vUv.x;            // 0 nozzle(right) .. 1 tail(left)
          float cy = vUv.y - 0.5;
          float width = mix(0.42, 0.04, along);
          float body = smoothstep(width, 0.0, abs(cy));
          float n = fbm(vec3(vUv.x*3.5, vUv.y*3.0, uTime*1.6));
          float life = (1.0-along);
          float heat = clamp(life*1.2 + (n-0.5)*0.7, 0.0, 1.0) * uThrottle;
          vec3 blue = vec3(0.30,0.6,1.0);
          vec3 gold = vec3(1.0,0.72,0.22);
          vec3 white= vec3(1.0,0.96,0.85);
          vec3 col = mix(blue, gold, smoothstep(0.0,0.20,along));
          col = mix(col, white, smoothstep(0.55,1.0,heat));
          float a = body*heat;
          gl_FragColor = vec4(col*a*1.35, a);
        }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false, side: THREE.DoubleSide
    });
    const plume = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), plumeMat);
    plume.position.z = 0.02; ship.add(plume);

    // soft engine glow — procedural radial falloff, exactly at nozzle, small & soft
    const glowMat = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color(0xffd6a0) }, uInt: { value: 0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `uniform vec3 uColor; uniform float uInt; varying vec2 vUv;
        void main(){ float d=distance(vUv,vec2(0.5)); float a=pow(smoothstep(0.5,0.0,d),2.0)*uInt; gl_FragColor=vec4(uColor*a,a); }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
    });
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), glowMat);
    glow.position.set(NOZZLE, 0, 0.03); ship.add(glow);

    // ===================== POST =====================
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), isMobile ? 0.5 : 0.6, 0.5, 0.75);
    composer.addPass(bloom);
    const grade = new ShaderPass({
      uniforms: { tDiffuse: { value: null }, uAmt: { value: 0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `uniform sampler2D tDiffuse; uniform float uAmt; varying vec2 vUv;
        void main(){
          vec2 dir = vUv-0.5; float d=length(dir);
          float ca=(0.0012+uAmt*0.008)*d;
          vec2 ur = clamp(vUv-dir*ca, 0.0, 1.0);
          vec2 ub = clamp(vUv+dir*ca, 0.0, 1.0);
          vec3 c; c.r=texture2D(tDiffuse,ur).r; c.g=texture2D(tDiffuse,vUv).g; c.b=texture2D(tDiffuse,ub).b;
          float vig=smoothstep(0.95,0.34,d); c*=mix(0.6,1.0,vig);
          gl_FragColor=vec4(c,1.0);
        }`
    });
    composer.addPass(grade);
    composer.addPass(new OutputPass());

    // ===================== AUDIO: music only =====================
    const bgm = document.getElementById('bgm'); let bgmStarted = false;
    function startBgm(){ if(bgmStarted||!bgm)return; bgmStarted=true; bgm.volume=0.5; bgm.play().catch(()=>{ bgmStarted=false; }); }
    // try to start music immediately on load; if browser blocks autoplay, the first interaction starts it
    window.addEventListener('load', startBgm);
    window.addEventListener('keydown', startBgm);

    const mute = document.getElementById('muteBtn');
    mute.addEventListener('click', (e)=>{ e.stopPropagation(); if(!bgm)return; bgm.muted=!bgm.muted; mute.textContent=bgm.muted?'\u2715':'\u266a'; mute.classList.toggle('off',bgm.muted);
      if(!bgm.muted && !bgmStarted) startBgm(); });
    document.getElementById('exitBtn').addEventListener('click', (e)=>{ e.stopPropagation(); try{bgm&&bgm.pause();}catch(_){} location.href='index.html?intro=1'; });

    // ===================== DRAG / THROTTLE =====================
    const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0,0,1),0);
    const ndc = new THREE.Vector2(), hitv = new THREE.Vector3();
    let dragging = false, tx = ship.position.x, ty = 0, xmax = 6, ymax = 3;
    function updateBounds(){ const vH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.position.z; const vW=vH*camera.aspect; xmax=vW*0.42; ymax=vH*0.40; }
    updateBounds();
    function toWorld(cx,cy){ ndc.set((cx/window.innerWidth)*2-1, -(cy/window.innerHeight)*2+1); ray.setFromCamera(ndc,camera); ray.ray.intersectPlane(plane,hitv); return hitv; }
    const hint = document.getElementById('hint');
    canvas.addEventListener('pointerdown', (e)=>{ dragging=true; canvas.classList.add('grabbing'); hint.style.opacity='0'; startBgm();
      const w=toWorld(e.clientX,e.clientY); tx=Math.max(-xmax,Math.min(xmax,w.x)); ty=Math.max(-ymax,Math.min(ymax,w.y)); try{canvas.setPointerCapture(e.pointerId);}catch(_){} });
    canvas.addEventListener('pointermove', (e)=>{ if(!dragging)return; const w=toWorld(e.clientX,e.clientY); tx=Math.max(-xmax,Math.min(xmax,w.x)); ty=Math.max(-ymax,Math.min(ymax,w.y)); });
    function release(){ dragging=false; canvas.classList.remove('grabbing'); }
    canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);

    window.addEventListener('resize', ()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight); composer.setSize(window.innerWidth,window.innerHeight); updateBounds(); });

    // ===================== LOOP =====================
    let throttle = 0.12, last = performance.now();
    function animate(){
      requestAnimationFrame(animate);
      const now = performance.now(); const ms = now-last; last = now;
      const dt = Math.min(ms/16.67, 3), tsec = now/1000;

      ship.position.x += (tx-ship.position.x)*0.18*dt;
      ship.position.y += (ty-ship.position.y)*0.18*dt;
      let t=(ship.position.x+xmax)/(2*xmax); t=Math.max(0,Math.min(1,t));
      throttle += (0.05 + t*t*0.95 - throttle)*0.08*dt;

      streakDist = (streakDist + (0.4 + throttle*throttle*6.0)*dt) % RANGE;
      streakMat.uniforms.uDist.value = streakDist;
      streakMat.uniforms.uSpeed.value = throttle;

      const pulse = 1.0 + 0.16*Math.sin(tsec*9.0) + 0.09*Math.sin(tsec*22.0+1.3);
      const plen = (0.5 + throttle*3.6) * pulse;
      const pwid = 0.42 + throttle*0.5;
      plume.scale.set(plen, pwid, 1);
      plume.position.x = NOZZLE - plen*0.5;
      plumeMat.uniforms.uTime.value = tsec;
      plumeMat.uniforms.uThrottle.value = throttle;

      const flick = 0.92 + Math.random()*0.16;
      glowMat.uniforms.uInt.value = (0.10 + throttle*0.30)*flick;
      glow.scale.setScalar(glowBase * (0.85 + throttle*0.7) * flick);
      engineLight.intensity = throttle*5;
      engineLight.position.set(ship.position.x + NOZZLE - 0.3, ship.position.y, 0);

      if (shipModel) ship.rotation.z = -throttle*0.1 + (dragging?0:Math.sin(now/1200)*0.02);
      camera.position.x = (Math.sin(now/55)+Math.sin(now/97))*throttle*0.04;
      camera.lookAt(0,0,0);
      grade.uniforms.uAmt.value = throttle;

      composer.render();
    }
    animate();
  </script>
</body>
</html>
