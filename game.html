<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>THE MITRO — HYPERSPACE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
    #scene { position: fixed; inset: 0; display: block; cursor: grab; touch-action: none; }
    #scene.grabbing { cursor: grabbing; }

    .game-btn {
      position: fixed; z-index: 30; cursor: pointer;
      background: rgba(0,0,0,0.35); color: #fff; border: 1px solid rgba(255,255,255,0.5);
      border-radius: 4px; font-family: 'Inter', sans-serif; font-weight: 500; letter-spacing: 0.18em;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      transition: color .2s, border-color .2s, background .2s;
    }
    .game-btn:hover { color: #FFFC52; border-color: rgba(255,252,82,0.8); }
    #exitBtn { top: 18px; right: 18px; padding: 9px 18px; font-size: 13px; }
    #muteBtn { top: 18px; left: 18px; width: 38px; height: 38px; font-size: 16px; padding: 0; line-height: 1; }
    #muteBtn.off { color: #888; }

    #hint {
      position: fixed; left: 0; right: 0; bottom: 26px; z-index: 20; text-align: center;
      font-size: 12px; letter-spacing: 0.18em; color: rgba(255,255,255,0.5); pointer-events: none;
      transition: opacity .6s ease;
    }
    #loading {
      position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
      background: #000; color: #fff; font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.3em; font-size: 28px;
    }
    .credit { position: fixed; bottom: 8px; right: 12px; z-index: 20; font-size: 10px; letter-spacing: 0.04em; color: #fff; opacity: 0.35; font-family: 'Bebas Neue', sans-serif; }
  </style>
</head>
<body>
  <div id="loading">ENTERING HYPERSPACE&#8230;</div>
  <canvas id="scene"></canvas>
  <div id="hint">&#8592; ТЯНИ КОРАБЛЬ &#183; МЕДЛЕННЕЕ &#160;&#160;|&#160;&#160; БЫСТРЕЕ &#8594;</div>
  <button id="exitBtn" class="game-btn" aria-label="Exit to site">EXIT</button>
  <button id="muteBtn" class="game-btn" aria-label="Toggle music">&#9834;</button>
  <div class="credit">THE MITRO</div>
  <audio id="bgm" src="game_track.mp3" loop preload="auto"></audio>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000007);
    scene.fog = new THREE.FogExp2(0x000010, 0.006);

    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 3000);
    camera.position.set(0, 1.1, 7.6);
    camera.lookAt(0, 0, 0);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    scene.add(new THREE.HemisphereLight(0x6688ff, 0x080816, 0.7));
    const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); scene.add(key);
    const rim = new THREE.DirectionalLight(0x88bbff, 1.3); rim.position.set(-4, 1, -3); scene.add(rim);
    const engineLight = new THREE.PointLight(0x66ccff, 0, 14, 2); scene.add(engineLight);

    const ship = new THREE.Group(); scene.add(ship);
    let shipModel = null;
    new GLTFLoader().load('ship.glb', (gltf) => {
      const m = gltf.scene;
      const box = new THREE.Box3().setFromObject(m);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      m.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      m.scale.setScalar(3.2 / maxDim);
      m.rotation.y = -Math.PI / 2;   // orient nose toward +X (screen right) — adjustable
      ship.add(m); shipModel = m;
      document.getElementById('loading').style.display = 'none';
    }, undefined, () => {
      document.getElementById('loading').textContent = 'ship.glb \u043d\u0435 \u043d\u0430\u0439\u0434\u0435\u043d';
    });

    const N = 700, R = 60, SPREAD = 15;
    const star = [];
    for (let i = 0; i < N; i++) star.push({ x: (Math.random()*2-1)*R, y: (Math.random()*2-1)*SPREAD, z: (Math.random()*2-1)*SPREAD });
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*6), 3));
    geom.setAttribute('color', new THREE.BufferAttribute(new Float32Array(N*6), 3));
    const streaks = new THREE.LineSegments(geom, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    scene.add(streaks);

    let throttle = 0.18, target = 0.18, dragging = false, lastX = 0;
    const idle = 0.18;
    const hint = document.getElementById('hint');
    canvas.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; canvas.classList.add('grabbing'); hint.style.opacity = '0'; startBgm(); try { canvas.setPointerCapture(e.pointerId); } catch(_){} });
    canvas.addEventListener('pointermove', (e) => { if (!dragging) return; target = Math.min(1, Math.max(0.05, target + (e.clientX - lastX) / window.innerWidth * 1.7)); lastX = e.clientX; });
    function release(){ dragging = false; canvas.classList.remove('grabbing'); }
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);

    const bgm = document.getElementById('bgm');
    let started = false;
    function startBgm(){ if (started || !bgm) return; started = true; bgm.volume = 0.5; bgm.play().catch(()=>{}); }
    window.addEventListener('keydown', startBgm);
    const mute = document.getElementById('muteBtn');
    mute.addEventListener('click', (e) => { e.stopPropagation(); if (!bgm) return; bgm.muted = !bgm.muted; mute.textContent = bgm.muted ? '\u2715' : '\u266a'; mute.classList.toggle('off', bgm.muted); });

    document.getElementById('exitBtn').addEventListener('click', (e) => { e.stopPropagation(); try { bgm && bgm.pause(); } catch(_){} location.href = 'index.html?intro=1'; });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let last = performance.now();
    function animate(){
      requestAnimationFrame(animate);
      const now = performance.now(); const dt = Math.min((now - last) / 16.67, 3); last = now;
      if (!dragging) target += (idle - target) * 0.02 * dt;
      throttle += (target - throttle) * 0.06 * dt;

      const speed = (0.55 + throttle * throttle * 14);
      const pos = geom.attributes.position.array, col = geom.attributes.color.array;
      const blue = throttle > 0.5 ? (throttle - 0.5) * 2 : 0;
      for (let i = 0; i < N; i++) {
        const s = star[i];
        s.x -= speed * dt;
        if (s.x < -R) { s.x = R; s.y = (Math.random()*2-1)*SPREAD; s.z = (Math.random()*2-1)*SPREAD; }
        const len = Math.min(44, speed * dt * 1.2 + throttle * throttle * 26 + 0.25);
        const j = i * 6;
        pos[j] = s.x; pos[j+1] = s.y; pos[j+2] = s.z;
        pos[j+3] = s.x + len; pos[j+4] = s.y; pos[j+5] = s.z;
        const prox = 0.4 + 0.6 * ((s.z + SPREAD) / (2 * SPREAD));
        const b = Math.min(1, 0.22 + throttle * 0.95) * prox;
        col[j] = col[j+3] = b * (1 - blue * 0.45);
        col[j+1] = col[j+4] = b * (1 - blue * 0.12);
        col[j+2] = col[j+5] = b;
      }
      geom.attributes.position.needsUpdate = true;
      geom.attributes.color.needsUpdate = true;

      if (shipModel) {
        ship.rotation.x = -throttle * 0.22 + Math.sin(now / 1400) * 0.03;
        ship.rotation.z = Math.sin(now / 1700) * 0.02;
        ship.position.y = Math.sin(now / 900) * 0.12;
      }
      engineLight.intensity = throttle * 7;
      engineLight.position.set(ship.position.x - 2.2, ship.position.y + 0.2, 0);
      camera.position.x = Math.sin(now / 60) * throttle * 0.07;
      camera.lookAt(0, ship.position.y * 0.5, 0);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
