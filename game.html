<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THE MITRO — PLAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", sans-serif;
    min-height: 100vh;
    background-color: black;
    overflow: hidden;
    font-family: Consolas, monospace;
    color: white;
}
canvas {
    position: absolute;
}

#starCanvas1 {
    z-index: 1;
}

#starCanvas2 {
    z-index: 2;
}

#starCanvas3 {
    z-index: 3;
}

#entityCanvas {
    z-index: 10;
}
#overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(
            to bottom,
            black,
            transparent 15%,
            transparent 85%,
            black
        ),
        linear-gradient(
            to right,
            black,
            transparent 10%,
            transparent 90%,
            black
        );
    z-index: 20;
}
.screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-size: 30px;
    opacity: 0;
    transition: opacity 200ms ease;
    pointer-events: none;
}

.screen.visible {
    opacity: 1;
}

.screen p {
    margin: 5px 0px;
}

h1,
h2 {
    font-size: 90px;
    text-transform: uppercase;
    font-weight: 300;
}

h1 {
    color: yellow;
    margin-bottom: 30px;
    text-shadow: 0px 0px 20px #fff6;
}

h2 {
    color: red;
}

h3 {
    margin-bottom: 20px;
}
#scoreDisplay {
    position: fixed;
    top: 10px;
    left: 15px;
    font-size: 20px;
    z-index: 30;
    opacity: 0.7;
}


/* ===== THE MITRO: site fonts + UI ===== */
body { font-family: 'Inter', sans-serif; }
h1, h2 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; }
.screen p { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 22px; letter-spacing: 0.02em; }
#scoreDisplay { font-family: 'Inter', sans-serif; }

.game-btn {
  position: fixed; z-index: 200; cursor: pointer;
  background: rgba(0,0,0,0.35); color: #fff;
  border: 1px solid rgba(255,255,255,0.5); border-radius: 4px;
  font-family: 'Inter', sans-serif; font-weight: 500; letter-spacing: 0.18em;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: color .2s, border-color .2s, background .2s;
}
.game-btn:hover { color: #FFFC52; border-color: rgba(255,252,82,0.8); }
#exitBtn { top: 18px; right: 18px; padding: 9px 18px; font-size: 13px; }
#muteBtn { top: 18px; left: 18px; width: 38px; height: 38px; font-size: 16px; padding: 0; line-height: 1; }
#muteBtn.off { color: #888; }
.credit { position: fixed; bottom: 8px; right: 12px; z-index: 30; font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.04em; color: #fff; opacity: 0.4; }
.credit a { color: inherit; }
@media (max-width: 700px) {
  h1, h2 { font-size: 56px; }
  .screen { font-size: 20px; }
  .screen p { font-size: 16px; }
}

/* ===== mobile touch controls ===== */
#touch-controls { display: none; }
body.touch #touch-controls { display: block; position: fixed; inset: 0; z-index: 150; pointer-events: none; }
.tc-btn {
  position: absolute; pointer-events: auto; user-select: none; -webkit-user-select: none; touch-action: none;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.32); color: #fff; border: 1px solid rgba(255,255,255,0.45);
  border-radius: 50%; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  font-family: 'Inter', sans-serif; font-size: 22px; line-height: 1;
  transition: background .12s, color .12s, transform .1s;
}
.tc-btn.on { background: rgba(255,252,82,0.18); color: #FFFC52; border-color: rgba(255,252,82,0.85); transform: scale(0.93); }
.tc-up    { left: 78px;  bottom: 150px; width: 58px; height: 58px; }
.tc-down  { left: 78px;  bottom: 30px;  width: 58px; height: 58px; }
.tc-left  { left: 18px;  bottom: 90px;  width: 58px; height: 58px; }
.tc-right { left: 138px; bottom: 90px;  width: 58px; height: 58px; }
.tc-fire  { right: 28px; bottom: 42px;  width: 86px; height: 86px; font-size: 14px; letter-spacing: .14em; }
.tc-start { right: 34px; bottom: 150px; width: 74px; height: 40px; border-radius: 22px; font-size: 12px; letter-spacing: .2em; }
    </style>

    <canvas id="starCanvas1"></canvas>
    <canvas id="starCanvas2"></canvas>
    <canvas id="starCanvas3"></canvas>
    <canvas id="entityCanvas"></canvas>
    <div id="overlay"></div>
    <div class="screen visible" id="loadingScreen">
        <p>Game is loading...</p>
    </div>
    <div class="screen" id="startScreen">
        <h1>Space Parallax</h1>
        <p>Use the arrow keys to navigate the spaceship.</p>
        <p>Use the Space key to shoot lazers.</p>
        <p>Press Enter to start/pause the game.</p>
    </div>
    <div class="screen" id="pauseScreen">
        Paused
    </div>
    <div class="screen" id="gameoverScreen">
        <h2>Gameover</h2>
        <h3 id="scoreDisplayEnd"></h3>
        <p>Press Enter to restart the game.</p>
    </div>
    <div id="scoreDisplay"></div>

    <div id="touch-controls" aria-hidden="true">
        <button class="tc-btn tc-up"    data-key="ArrowUp">&#9650;</button>
        <button class="tc-btn tc-down"  data-key="ArrowDown">&#9660;</button>
        <button class="tc-btn tc-left"  data-key="ArrowLeft">&#9664;</button>
        <button class="tc-btn tc-right" data-key="ArrowRight">&#9654;</button>
        <button class="tc-btn tc-fire"  data-key=" " data-rep="170">FIRE</button>
        <button class="tc-btn tc-start" data-key="Enter" data-once="1">START</button>
    </div>

    <button id="exitBtn" class="game-btn" aria-label="Exit to site">EXIT</button>
    <button id="muteBtn" class="game-btn" aria-label="Toggle music">♪</button>
    <div class="credit">Engine by <a href="https://github.com/ScriptRaccoon/spaceship-parallax" target="_blank" rel="noopener">Script Raccoon</a> · sprites: opengameart.org</div>
    <audio id="bgm" src="game_track.mp3" loop preload="auto"></audio>

    <script>
    (function () {
      var bgm = document.getElementById('bgm'), started = false;
      function startBgm() { if (started || !bgm) return; started = true; bgm.volume = 0.5; bgm.play().catch(function(){}); }
      window.addEventListener('keydown', startBgm);
      window.addEventListener('pointerdown', startBgm);

      var mute = document.getElementById('muteBtn');
      if (mute) mute.addEventListener('click', function () {
        if (!bgm) return;
        bgm.muted = !bgm.muted;
        mute.textContent = bgm.muted ? '✕' : '♪';
        mute.classList.toggle('off', bgm.muted);
      });

      var exit = document.getElementById('exitBtn');
      if (exit) exit.addEventListener('click', function () {
        try { if (bgm) bgm.pause(); } catch (e) {}
        location.href = 'index.html?intro=1';   // triggers the TM intro and lands on Work
      });

      // ----- mobile touch controls: dispatch the same keys the game already listens for -----
      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
      function fireKey(type, key) { window.dispatchEvent(new KeyboardEvent(type, { key: key, bubbles: true })); }
      document.querySelectorAll('#touch-controls .tc-btn').forEach(function (btn) {
        var key = btn.getAttribute('data-key');
        var once = btn.getAttribute('data-once') === '1';
        var rep = parseInt(btn.getAttribute('data-rep') || '30', 10);
        var timer = null;
        function down(e) {
          e.preventDefault(); startBgm(); btn.classList.add('on');
          fireKey('keydown', key);
          if (!once && !timer) timer = setInterval(function () { fireKey('keydown', key); }, rep);
        }
        function up() {
          btn.classList.remove('on');
          if (timer) { clearInterval(timer); timer = null; }
          if (!once) fireKey('keyup', key);
        }
        btn.addEventListener('pointerdown', down);
        btn.addEventListener('pointerup', up);
        btn.addEventListener('pointercancel', up);
        btn.addEventListener('pointerleave', up);
      });
    })();
    </script>
</body>
</html>
